<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>设备租赁管理系统</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
.nav-btn {
  color: #6b7280;
  border-color: transparent;
  transition: all 0.2s ease;
}
.nav-btn:hover {
  color: #374151;
  border-color: #d1d5db;
}
.nav-btn.active {
  color: #2563eb;
  border-color: #2563eb;
}
.btn-primary {
  background-color: #2563eb;
  color: white;
  padding: 0.5rem 1rem;
  border-radius: 0.375rem;
  font-size: 0.875rem;
  font-weight: 500;
}
.btn-primary:hover {
  background-color: #1d4ed8;
}
.btn-secondary {
  background-color: #e5e7eb;
  color: #374151;
  padding: 0.5rem 1rem;
  border-radius: 0.375rem;
  font-size: 0.875rem;
  font-weight: 500;
}
.btn-secondary:hover {
  background-color: #d1d5db;
}
.btn-danger {
  background-color: #dc2626;
  color: white;
  padding: 0.5rem 1rem;
  border-radius: 0.375rem;
  font-size: 0.875rem;
  font-weight: 500;
}
.btn-danger:hover {
  background-color: #b91c1c;
}
.btn-success {
  background-color: #16a34a;
  color: white;
  padding: 0.5rem 1rem;
  border-radius: 0.375rem;
  font-size: 0.875rem;
  font-weight: 500;
}
.btn-success:hover {
  background-color: #15803d;
}
.btn-sm {
  padding: 0.25rem 0.75rem;
  font-size: 0.75rem;
}
.table-container {
  overflow-x: auto;
}
table {
  width: 100%;
  border-collapse: collapse;
}
th {
  background-color: #f9fafb;
  padding: 0.75rem 1rem;
  text-align: left;
  font-size: 0.75rem;
  font-weight: 600;
  text-transform: uppercase;
  color: #6b7280;
  border-bottom: 1px solid #e5e7eb;
}
td {
  padding: 0.75rem 1rem;
  font-size: 0.875rem;
  color: #374151;
  border-bottom: 1px solid #e5e7eb;
}
tr:hover {
  background-color: #f9fafb;
}
.badge {
  display: inline-flex;
  align-items: center;
  padding: 0.125rem 0.625rem;
  border-radius: 9999px;
  font-size: 0.75rem;
  font-weight: 500;
}
.badge-green {
  background-color: #dcfce7;
  color: #166534;
}
.badge-yellow {
  background-color: #fef3c7;
  color: #92400e;
}
.badge-red {
  background-color: #fee2e2;
  color: #991b1b;
}
.badge-blue {
  background-color: #dbeafe;
  color: #1e40af;
}
.badge-gray {
  background-color: #f3f4f6;
  color: #374151;
}
.modal-overlay {
  position: fixed;
  inset: 0;
  background-color: rgba(0, 0, 0, 0.5);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 50;
  padding: 1rem;
}
.modal-content {
  background-color: white;
  border-radius: 0.5rem;
  box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
  max-width: 600px;
  width: 100%;
  max-height: 90vh;
  overflow-y: auto;
}
.modal-header {
  padding: 1rem 1.5rem;
  border-bottom: 1px solid #e5e7eb;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.modal-body {
  padding: 1.5rem;
}
.modal-footer {
  padding: 1rem 1.5rem;
  border-top: 1px solid #e5e7eb;
  display: flex;
  justify-content: flex-end;
  gap: 0.75rem;
}
.form-group {
  margin-bottom: 1rem;
}
.form-label {
  display: block;
  font-size: 0.875rem;
  font-weight: 500;
  color: #374151;
  margin-bottom: 0.25rem;
}
.form-input, .form-select, .form-textarea {
  width: 100%;
  padding: 0.5rem 0.75rem;
  border: 1px solid #d1d5db;
  border-radius: 0.375rem;
  font-size: 0.875rem;
}
.form-input:focus, .form-select:focus, .form-textarea:focus {
  outline: none;
  border-color: #2563eb;
  box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
}
.form-textarea {
  resize: vertical;
  min-height: 80px;
}
.toast {
  padding: 0.75rem 1rem;
  border-radius: 0.375rem;
  box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
  display: flex;
  align-items: center;
  gap: 0.5rem;
  animation: slideIn 0.3s ease;
}
.toast-success {
  background-color: #dcfce7;
  color: #166534;
  border: 1px solid #bbf7d0;
}
.toast-error {
  background-color: #fee2e2;
  color: #991b1b;
  border: 1px solid #fecaca;
}
@keyframes slideIn {
  from { transform: translateX(100%); opacity: 0; }
  to { transform: translateX(0); opacity: 1; }
}
.loading {
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 2rem;
}
.spinner {
  width: 2rem;
  height: 2rem;
  border: 3px solid #e5e7eb;
  border-top-color: #2563eb;
  border-radius: 50%;
  animation: spin 1s linear infinite;
}
@keyframes spin {
  to { transform: rotate(360deg); }
}
.page-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 1.5rem;
}
.page-title {
  font-size: 1.5rem;
  font-weight: 700;
  color: #111827;
}
.card {
  background-color: white;
  border-radius: 0.5rem;
  box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1);
  overflow: hidden;
}
.empty-state {
  text-align: center;
  padding: 3rem 1rem;
  color: #6b7280;
}
  </style>
</head>
<body class="bg-gray-50 min-h-screen">
  <div id="app">
    <nav class="bg-white shadow-sm border-b">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between h-16">
          <div class="flex">
            <div class="flex-shrink-0 flex items-center">
              <h1 class="text-xl font-bold text-gray-800">设备租赁管理系统</h1>
            </div>
            <div class="hidden sm:ml-6 sm:flex sm:space-x-1">
              <button data-page="devices" class="nav-btn inline-flex items-center px-3 pt-1 border-b-2 text-sm font-medium">
                设备台账
              </button>
              <button data-page="rental-orders" class="nav-btn inline-flex items-center px-3 pt-1 border-b-2 text-sm font-medium">
                租赁管理
              </button>
              <button data-page="inspections" class="nav-btn inline-flex items-center px-3 pt-1 border-b-2 text-sm font-medium">
                巡检管理
              </button>
              <button data-page="damage-claims" class="nav-btn inline-flex items-center px-3 pt-1 border-b-2 text-sm font-medium">
                赔扣管理
              </button>
              <button data-page="contracts" class="nav-btn inline-flex items-center px-3 pt-1 border-b-2 text-sm font-medium">
                合同管理
              </button>
              <button data-page="reshoot-review" class="nav-btn inline-flex items-center px-3 pt-1 border-b-2 text-sm font-medium">
                补拍复核
              </button>
            </div>
          </div>
          <div class="flex items-center">
            <span class="text-sm text-gray-500">管理员</span>
          </div>
        </div>
      </div>
      <div class="sm:hidden border-t">
        <div class="pt-2 pb-3 space-y-1">
          <button data-page="devices" class="nav-btn block w-full text-left pl-3 pr-4 py-2 text-base font-medium">
            设备台账
          </button>
          <button data-page="rental-orders" class="nav-btn block w-full text-left pl-3 pr-4 py-2 text-base font-medium">
            租赁管理
          </button>
          <button data-page="inspections" class="nav-btn block w-full text-left pl-3 pr-4 py-2 text-base font-medium">
            巡检管理
          </button>
          <button data-page="damage-claims" class="nav-btn block w-full text-left pl-3 pr-4 py-2 text-base font-medium">
            赔扣管理
          </button>
          <button data-page="contracts" class="nav-btn block w-full text-left pl-3 pr-4 py-2 text-base font-medium">
            合同管理
          </button>
          <button data-page="reshoot-review" class="nav-btn block w-full text-left pl-3 pr-4 py-2 text-base font-medium">
            补拍复核
          </button>
        </div>
      </div>
    </nav>

    <main id="main-content" class="max-w-7xl mx-auto py-6 px-4 sm:px-6 lg:px-8">
    </main>
  </div>

  <div id="toast-container" class="fixed top-4 right-4 z-50 space-y-2"></div>

  <div id="modal-container"></div>

  <script src="js/app.js"></script>
</body>
</html>
